<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human-Machine Interaction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            position: relative;
        }
        h1 {
    font-size: 4rem;
    font-weight: 800;
    color: #ffffff;
    opacity: 0;
    animation: fadeIn 2s ease-in-out forwards;
    margin-bottom: 10px; /* Adjust the bottom margin to reduce space */
}



        .start-button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #fff;
            background-color: #282d2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }
        .start-button:hover {
            background-color: #283336;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <video class="background-video" autoplay loop muted>
        <source src="videos/video.mp4" type="video/mp4">
    </video>
    <div class="container">
        <h1>Bridging the Gap Between Humans and Machines</h1>
        <!-- <p>Experience the future of seamless interaction.</p> -->
        <button class="start-button" onclick="location.href='3.html'">START</button>
    </div>
</body>
</html>
